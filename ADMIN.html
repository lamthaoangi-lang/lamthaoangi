<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Quản trị – Lâm Thao Ăn Gì</title>
<style>
:root{--bg:#eef5ef;--card:#fff;--ink:#17261d;--mute:#5f7266;--brand:#14532d;--line:#cfe0d4;--red:#d7263d}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,'Segoe UI',sans-serif;padding-bottom:70px}
.w{max-width:720px;margin:0 auto;padding:10px}
h1{font-size:1.2rem;color:var(--brand);padding:8px 0}
nav{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;gap:6px;padding:8px 10px;overflow-x:auto}
nav button{flex:none;padding:10px 16px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font:inherit;cursor:pointer}
nav button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.c{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}.th{width:44px;height:44px;border-radius:12px;background:#e3f1e7;display:grid;place-items:center;overflow:hidden;font-size:1.5rem;flex:none}.th img{width:100%;height:100%;object-fit:cover}
label{display:block;font-size:.8rem;color:var(--mute);margin:8px 0 3px}
input:not([type=checkbox]),select,textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.g{display:flex;gap:8px;margin-top:6px}.g>input{flex:1}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer;padding:10px 14px;border-radius:10px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);font-weight:600}
button.p{background:var(--brand);color:#fff}button.d{border-color:var(--red);color:var(--red)}
.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.95rem}
pre{white-space:pre-wrap;font:inherit;background:#f4f8f5;border-radius:10px;padding:8px;margin:6px 0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:#e3f1e7;font-size:.8rem}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#17261d;color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:9;max-width:90%}
.login{max-width:340px;margin:18vh auto;text-align:center}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}th{color:var(--mute);font-weight:600}.big{font-size:1.5rem;font-weight:800;color:var(--brand)}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:9px 4px}.gh{font-size:.95rem;color:var(--brand);margin:14px 2px 8px}.qk{padding:10px}
.sv{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);padding:10px;box-shadow:0 -2px 12px rgba(0,0,0,.12)}.sv[hidden]{display:none}.sv button{display:block;max-width:700px;margin:0 auto;width:100%;padding:14px;font-size:1rem}.sv button:disabled{opacity:.6}body{padding-bottom:90px}
.mv{display:flex;gap:6px;margin-top:8px}.mv button{flex:1;padding:8px 2px;font-size:.85rem}button:disabled{opacity:.4;cursor:default}.rk{display:inline-block;min-width:26px;text-align:center;background:var(--brand);color:#fff;border-radius:99px;font-size:.78rem;padding:1px 8px;margin-right:6px}</style></head><body>
<div class="w"><h1>🛠️ Quản trị Lâm Thao Ăn Gì</h1></div>
<nav id="nav" hidden><button data-v="shops">🏪 Quán</button><button data-v="items">🍜 Món</button><button data-v="orders">📦 Đơn</button><button data-v="rates">⭐ Đánh giá</button><button data-v="rev">📊 Doanh thu</button><button data-v="cfg">⚙️ Cài đặt</button><button data-reload>↻</button></nav>
<div class="w" id="main"><div class="login c"><b>Nhập mật khẩu quản trị</b><div class="g"><input id="pw" type="password" autocomplete="current-password"><button class="p" id="go">Vào</button></div></div></div>
<div id="toast"></div>
<div class="sv" id="sv" hidden><button class="p" data-saveall>💾 Lưu tất cả</button></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwyheCMFxZJvm-lgD4Zm4ggdj8m984nfakQ1cIgEHGdLal1JfRh5HFS0knEpCz3dDlq/exec';
const $=i=>document.getElementById(i);let D=null,PASS='',V='shops',CUR='';
try{PASS=sessionStorage.getItem('ap')||''}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('vi-VN')+'đ';
function imgUrl(u){u=String(u||'').trim();const m=u.match(/drive\.google\.com.*?(?:\/d\/|[?&]id=)([\w-]+)/);return m?'https://lh3.googleusercontent.com/d/'+m[1]+'=w200':u}
const thumb=(u,e)=>`<span class="th">${u?`<img src="${esc(imgUrl(u))}" alt="" onerror="this.remove()">`:e||'🏪'}</span>`;
function toast(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',2800)}
async function call(o){o.admin=1;o.pass=PASS;try{return await (await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)})).json()}catch(e){return{ok:false,msg:'Lỗi mạng hoặc chưa triển khai phiên bản mới của Apps Script.'}}}
async function load(){const r=await call({act:'load'});if(!r.ok){toast(r.msg||'Lỗi');if(!D){PASS='';$('nav').hidden=true}return false}
 D=r;if(!CUR||!D.shops.some(s=>s.name===CUR))CUR=D.shops[0]?D.shops[0].name:'';$('nav').hidden=false;render();return true}
$('go').onclick=async()=>{PASS=$('pw').value;if(await load())try{sessionStorage.setItem('ap',PASS)}catch(e){}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
function pick(cb,max){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{if(!f.files[0])return;const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82).split(',')[1])};im.src=URL.createObjectURL(f.files[0])};f.click()}
const get=c=>{const o={};c.querySelectorAll('[data-f]').forEach(i=>o[i.dataset.f]=i.type==='checkbox'?i.checked:i.value.trim());return o};
const EMAIL_RE=/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/;
const BADGES=[['','Không có nhãn'],['hot','🔥 Bán chạy'],['star','⭐ Nổi bật'],['new','🆕 Quán mới'],['promo','🎁 Khuyến mãi'],['fav','💚 Yêu thích']];
const badgeOpts=v=>BADGES.map(([k,l])=>`<option value="${k}" ${k===(v||'')?'selected':''}>${l}</option>`).join('');
const mvRow=i=>{const n=D.shops.length;return `<div class="mv"><button data-mv="top" data-mi="${i}" ${i?'':'disabled'}>⏫ Lên đầu</button><button data-mv="up" data-mi="${i}" ${i?'':'disabled'}>↑ Lên</button><button data-mv="down" data-mi="${i}" ${i<n-1?'':'disabled'}>↓ Xuống</button><button data-mv="bottom" data-mi="${i}" ${i<n-1?'':'disabled'}>⏬ Cuối</button></div>`};
function snap(){const m={};document.querySelectorAll('#main [data-t=shop]').forEach(c=>{m[c.dataset.n]=get(c)});return m}
function restore(m){document.querySelectorAll('#main [data-t=shop]').forEach(c=>{const v=m[c.dataset.n];if(!v)return;c.querySelectorAll('[data-f]').forEach(i=>{if(!(i.dataset.f in v))return;if(i.type==='checkbox')i.checked=v[i.dataset.f];else i.value=v[i.dataset.f]})})}
async function moveShop(i,dir){
 const a=D.shops,n=a.length,j=dir==='up'?i-1:dir==='down'?i+1:dir==='top'?0:n-1;
 if(j<0||j>=n||j===i)return;
 const draft=snap(),s=a.splice(i,1)[0];a.splice(j,0,s);render();restore(draft); // giữ nguyên chữ đang gõ dở ở các quán
 const el=[...document.querySelectorAll('#main [data-t=shop]')].find(c=>c.dataset.n===s.name);if(el)el.scrollIntoView({block:'center',behavior:'smooth'});
 const r=await call({act:'saveOrder',names:a.map(x=>x.name)});
 if(r.ok)toast('Đã đổi thứ tự ✓');else{toast(r.msg||'Lỗi lưu thứ tự');await load()}
}
const shopRow=(s,i)=>`<div class="c" data-t="shop" data-n="${esc(s.name)}"><div class="hd">${thumb(s.logo)}<div><span class="rk">${i+1}</span><b>${esc(s.name)}</b><br><small>${s.items.length} món · 🛒 ${s.sold||0} đơn đã bán${s.show?'':' · ĐANG ẨN'}${s.busy?' · 🔴 ĐANG BẬN':''}${s.email?' · ✉️ '+esc(s.email):' · ✉️ chưa có email'}</small></div></div>
<label>Logo quán (dán link hoặc bấm Tải ảnh)</label><div class="g"><input data-f="logo" value="${esc(s.logo)}"><button data-up="logo">Tải ảnh</button></div>
<label>Mô tả ngắn: quán bán gì (VD: Trà sữa · Cà phê · Ăn vặt)</label><input data-f="desc" value="${esc(s.desc)}">
<label>✉️ Gmail nhận đơn của quán (khách đặt món của quán này thì quán nhận mail; để trống = quán không nhận mail)</label><input data-f="email" type="email" inputmode="email" autocomplete="off" placeholder="quan@gmail.com" value="${esc(s.email)}">
<label>Nhãn hiển thị cạnh tên quán trên trang khách</label><select data-f="badge">${badgeOpts(s.badge)}</select>
<label class="ck"><input type="checkbox" data-f="show" ${s.show?'checked':''}> Hiện quán trên web</label>
<div class="g"><button class="${s.busy?'p':'d'}" data-busy="${i}">${s.busy?'🟢 Mở lại quán':'🔴 Đóng quán (bận)'}</button><button class="p" data-saveshop="${i}">Lưu quán</button><button data-menu="${i}">Sửa món ›</button></div>${mvRow(i)}</div>`;
const itemRow=it=>`<div class="c" data-t="item" data-row="${it.row||0}"><div class="hd">${thumb(it.img,esc(it.emoji)||'🍽️')}<b>${it.row?esc(it.name):'➕ Thêm món mới'}</b></div>
<input data-f="name" placeholder="Tên món" value="${esc(it.name)}"><div class="g2" style="margin-top:6px"><input data-f="price" inputmode="numeric" placeholder="Giá (VD 25000)" value="${esc(it.price)}"><input data-f="emoji" placeholder="Emoji" value="${esc(it.emoji)}"></div>
<input data-f="desc" placeholder="Mô tả món" style="margin-top:6px" value="${esc(it.desc)}"><label>Nhóm món</label><select data-f="cat">${catOpts(it.cat)}</select>
<div class="g"><input data-f="img" placeholder="Link ảnh món" value="${esc(it.img)}"><button data-up="img">Tải ảnh</button></div>
<label>Trạng thái món</label><select data-f="state"><option value="show" ${!it.state||it.state==='show'?'selected':''}>Đang bán</option><option value="out" ${it.state==='out'?'selected':''}>Hết món (khách thấy nhưng không đặt được)</option><option value="hide" ${it.state==='hide'?'selected':''}>Ẩn khỏi web</option></select>
<div class="g"><button class="p" data-saveitem>Lưu món</button>${it.row?'<button class="d" data-del>Xóa</button>':''}</div></div>`;
const cfgHtml=()=>{const c=D.cfg||{};return `<div class="c" data-t="cfg"><b>⚙️ Cài đặt cửa hàng</b>
<label>Thông báo trượt khi khách vừa vào web</label><input data-f="banner" value="${esc(c.banner)}" placeholder="VD: Hôm nay freeship đơn từ 100k!">
<div class="g2"><div><label>Giờ mở (0-23)</label><input data-f="open" inputmode="numeric" value="${esc(c.open)}"></div><div><label>Giờ đóng</label><input data-f="close" inputmode="numeric" value="${esc(c.close)}"></div></div>
<label>Đơn tối thiểu (đồng)</label><input data-f="min" inputmode="numeric" value="${esc(c.min)}">
<label>Phí giao hàng cố định (đồng, 0 = thỏa thuận)</label><input data-f="ship" inputmode="numeric" value="${esc(c.ship)}"><label>Miễn phí giao từ đơn (đồng, 0 = không có)</label><input data-f="free" inputmode="numeric" value="${esc(c.free)}"><label class="ck"><input type="checkbox" data-f="pause" ${c.pause?'checked':''}> Tạm nghỉ nhận đơn</label>
<div class="g"><button class="p" data-savecfg>Lưu cài đặt</button></div></div>`};
const BLANK={row:0,name:'',price:'',desc:'',emoji:'',img:'',cat:''};
let IM='detail';try{IM=localStorage.getItem('im')||'detail'}catch(e){}
let CW=null,CWS='';
const mapOk=u=>/^https:\/\/(www\.)?google\.com\/maps/.test(String(u||''));
function curCats(){const s=D&&D.shops.find(x=>x.name===CUR);return s?s.cats||[]:[]}
function cw(){if(!CW||CWS!==CUR){CW=curCats().map(c=>({o:c,n:c}));CWS=CUR}return CW}
function catOpts(c){c=c||'';const cs=curCats();return '<option value="">(Chưa phân nhóm)</option>'+cs.map(x=>`<option ${x===c?'selected':''}>${esc(x)}</option>`).join('')+(c&&!cs.includes(c)?`<option selected>${esc(c)}</option>`:'')}
const grouped=(s,fn)=>{const cs=s.cats||[],known=new Set(cs);let out='';[...cs,''].forEach(c=>{const a=s.items.filter(i=>c?i.cat===c:!known.has(i.cat||''));if(a.length)out+=`<h3 class="gh">${esc(c||'Chưa phân nhóm')} <small>(${a.length})</small></h3>`+a.map(fn).join('')});return out};
const quickRow=it=>`<div class="c qk"><div class="hd" style="margin:0">${thumb(it.img,esc(it.emoji)||'🍽️')}<div style="flex:1;min-width:0"><b>${esc(it.name)}</b><br><small>${money(it.price)}</small></div></div><div class="seg">${[['show','Đang bán'],['out','Hết món'],['hide','Ẩn']].map(([k,l])=>`<button class="${(it.state||'show')===k?'p':''}" data-qs="${k}" data-row="${it.row}" data-name="${esc(it.name)}">${l}</button>`).join('')}</div></div>`;
const catsCard=s=>{const w=cw();return `<div class="c" data-t="cats"><b>🗂️ Nhóm món của quán</b><br><small style="color:var(--mute)">VD: 🍟 Đồ ăn vặt, 🍔 Đồ ăn nhanh, 🥤 Đồ uống. Khách thấy các nhóm này khi vào quán. Dùng ↑ ↓ để đổi thứ tự. Xóa nhóm thì món của nhóm đó về "Chưa phân nhóm". Nhớ bấm Lưu nhóm.</small>${w.map((c,i)=>`<div class="g" data-ci="${i}"><input data-cname value="${esc(c.n)}"><button data-cup="${i}" ${i?'':'disabled'}>↑</button><button data-cdn="${i}" ${i<w.length-1?'':'disabled'}>↓</button><button class="d" data-cdel="${i}">✕</button></div>`).join('')}<div class="g"><input id="ncat" placeholder="Tên nhóm mới"><button data-cadd>Thêm</button></div><button class="p" data-csave style="margin-top:8px;width:100%">Lưu nhóm</button></div>`};
let REV=null,RM='',RS='',RO=false;
function revHtml(){
 if(!REV)return '<p>Đang tải doanh thu…</p>';
 const ok=r=>r.st!=='Hủy'&&(!RO||r.st==='Đã giao'),val=r=>RS?(r.s[RS]||0):r.t;
 const ms=[...new Set(REV.map(r=>r.d.slice(0,7)))].sort().reverse();if(!ms.includes(RM))RM=ms[0]||'';
 const shops=[...new Set(REV.flatMap(r=>Object.keys(r.s)))].sort();
 const rows=REV.filter(r=>ok(r)&&val(r)>0),mo=rows.filter(r=>r.d.slice(0,7)===RM);
 const grp=(a,k)=>{const g={};a.forEach(r=>{const x=g[k(r)]=g[k(r)]||{n:0,t:0};x.n++;x.t+=val(r)});return g};
 const tbl=(g,desc,h)=>{const ks=Object.keys(g).sort();if(desc)ks.reverse();return `<table><tr><th>${h}</th><th>Đơn</th><th>Doanh thu</th></tr>${ks.map(k=>`<tr><td>${esc(k)}</td><td>${g[k].n}</td><td><b>${money(g[k].t)}</b></td></tr>`).join('')||'<tr><td colspan=3>Chưa có dữ liệu</td></tr>'}</table>`};
 const sh={};REV.filter(r=>ok(r)&&r.d.slice(0,7)===RM).forEach(r=>{for(const s in r.s){if(r.s[s]>0){const x=sh[s]=sh[s]||{n:0,t:0};x.n++;x.t+=r.s[s]}}});
 const tot=mo.reduce((s,r)=>s+val(r),0);
 return `<div class="c"><div class="g2"><div><label>Tháng</label><select id="rm">${ms.map(m=>`<option ${m===RM?'selected':''}>${m}</option>`).join('')}</select></div><div><label>Cửa hàng</label><select id="rs"><option value="">Tất cả</option>${shops.map(s=>`<option ${s===RS?'selected':''}>${esc(s)}</option>`).join('')}</select></div></div>
<label class="ck"><input type="checkbox" id="ro" ${RO?'checked':''}> Chỉ tính đơn đã giao</label><small style="color:var(--mute)">Mặc định tính mọi đơn trừ đơn Hủy. Tất cả = tiền món + phí giao. Chọn 1 cửa hàng = tiền món của quán đó. Đơn cũ (trước bản cập nhật này) được ước tính theo giá hiện tại.</small></div>
<div class="c"><small>Tháng ${esc(RM)} ${RS?'· '+esc(RS):''}</small><div class="big">${money(tot)}</div><small>${mo.length} đơn</small></div>
<div class="c"><b>Từng ngày</b>${tbl(grp(mo,r=>r.d.slice(8)+'/'+r.d.slice(5,7)),true,'Ngày')}</div>
<div class="c"><b>Theo cửa hàng (tháng ${esc(RM)})</b>${tbl(sh,false,'Cửa hàng')}</div>
<div class="c"><b>Từng tháng</b>${tbl(grp(rows,r=>r.d.slice(0,7)),true,'Tháng')}</div>`}
function render(){document.querySelectorAll('#nav [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===V));let h='';
 if(V==='shops')h=`<div class="c"><b>➕ Thêm quán mới</b><div class="g"><input id="nn" placeholder="Tên quán"></div><label>✉️ Gmail nhận đơn của quán (không bắt buộc, có thể thêm sau)</label><div class="g"><input id="ne" type="email" inputmode="email" autocomplete="off" placeholder="quan@gmail.com"><button class="p" data-addshop>Thêm</button></div></div>`+D.shops.map(shopRow).join('');
 else if(V==='items'){const s=D.shops.find(x=>x.name===CUR);h=`<div class="c"><label style="margin:0">Chọn quán</label><select id="sel">${D.shops.map(x=>`<option ${x.name===CUR?'selected':''}>${esc(x.name)}</option>`).join('')}</select><label>Chế độ phần món ăn</label><div class="g"><button class="${IM==='quick'?'':'p'}" data-im="detail">📝 Chi tiết (sửa món)</button><button class="${IM==='quick'?'p':''}" data-im="quick">⚡ Nhanh (bật/tắt món)</button></div></div>`+(s?catsCard(s)+(IM==='quick'?grouped(s,quickRow):itemRow(BLANK)+'<div class="c"><button data-addnew style="width:100%">➕ Thêm ô món nữa</button></div>'+grouped(s,itemRow)):'<p>Chưa có quán.</p>')}
 else if(V==='orders')h=`<p style="margin:4px 0 10px;color:var(--mute)">Chuyển sang <b>Đã giao</b> thì khách mới đánh giá được quán.</p>`+(D.orders.map(o=>`<div class="c"><b>${esc(o.code)}</b> <small>${esc(o.time)}</small><br>${esc(o.name)} · <a href="tel:${esc(o.phone)}" style="font-weight:700">📞 ${esc(o.phone)}</a><br><small>${esc(o.addr)}</small>${mapOk(o.map)?` · <a href="${esc(o.map)}" target="_blank" rel="noopener">📍 Bản đồ</a>`:""}${o.note?`<br><small>📝 ${esc(o.note)}</small>`:""}<pre>${esc(o.detail)}</pre><b>${money(o.total)}</b> · ${esc(o.pay)}${o.ship?` · giao: ${esc(o.ship)}`:""}<div class="g"><select data-st="1" data-row="${o.row}" data-code="${esc(o.code)}">${['Mới','Đã báo quán','Đang giao','Đã giao','Hủy'].map(x=>`<option ${x===o.status?'selected':''}>${x}</option>`).join('')}${['Mới','Đã báo quán','Đang giao','Đã giao','Hủy'].includes(o.status)?'':`<option selected>${esc(o.status)}</option>`}</select></div><label class="ck" style="margin-top:8px"><input type="checkbox" data-paid="1" data-row="${o.row}" data-code="${esc(o.code)}" ${o.paid==='Đã thu'?'checked':''}> Đã nhận tiền</label></div>`).join('')||'<p>Chưa có đơn.</p>');
 else if(V==='cfg')h=cfgHtml();else if(V==='rev')h=revHtml();else h=D.ratings.map(r=>`<div class="c"><b>${esc(r.shop)}</b> <span class="tag">${'★'.repeat(r.star)}${'☆'.repeat(5-r.star)}</span><br>${esc(r.cmt)||'<i>(không nhận xét)</i>'}<br><small>${esc(r.name)} · ${esc(r.code)} · ${esc(r.time)}</small></div>`).join('')||'<p>Chưa có đánh giá.</p>';
 $('main').innerHTML=h;$('sv').hidden=!(V==='shops'||(V==='items'&&IM!=='quick'))}
async function saveAll(b){
 b.disabled=true;const old=b.textContent;
 try{
  if(V==='shops'){
   const cards=[...document.querySelectorAll('#main [data-t=shop]')];let n=0,bad=0;
   for(let i=0;i<cards.length;i++){
    const s=D.shops[i],v=get(cards[i]);if(!s)continue;
    if(v.logo===String(s.logo||'')&&v.desc===String(s.desc||'')&&v.show===!!s.show&&v.email===String(s.email||'')&&v.badge===String(s.badge||''))continue;
    if(v.email&&!EMAIL_RE.test(v.email)){toast('Email của quán "'+s.name+'" chưa đúng định dạng');bad++;continue}
    b.textContent='Đang lưu '+s.name+'…';
    const r=await call({act:'saveShop',name:s.name,...v,busy:s.busy});r.ok?n++:bad++;
   }
   if(!n&&!bad)toast('Không có thay đổi để lưu');
   else if(n||!bad){toast('Đã lưu '+n+' quán ✓'+(bad?' · lỗi '+bad+' quán':''));await load()}
   return}
  if(V==='items'){
   const s=D.shops.find(x=>x.name===CUR);if(!s)return;
   const list=[];let err='';
   document.querySelectorAll('#main [data-t=item]').forEach(c=>{
    if(err)return;
    const v=get(c),row=+c.dataset.row;
    if(!row){if(!v.name)return;if(!(Number(v.price)>0)){err='Món "'+v.name+'" chưa có giá';return}list.push({...v,row:0});return}
    const o=s.items.find(x=>x.row===row);if(!o)return;
    if(!v.name){err='Có món đang để trống tên';return}
    const same=v.name===String(o.name)&&Number(v.price)===Number(o.price)&&v.desc===String(o.desc||'')&&v.emoji===String(o.emoji||'')&&v.cat===String(o.cat||'')&&v.img===String(o.img||'')&&v.state===(o.state||'show');
    if(!same)list.push({...v,row,orig:o.name});
   });
   if(err){toast(err);return}
   if(!list.length){toast('Không có thay đổi để lưu');return}
   b.textContent='Đang lưu '+list.length+' món…';
   let r=await call({act:'saveItems',shop:CUR,items:list});
   if(!r.ok&&/không hợp lệ/.test(r.msg||'')){ // Apps Script bản cũ: lưu từng món
    r={ok:true};
    for(let k=0;k<list.length&&r.ok;k++){b.textContent='Đang lưu '+(k+1)+'/'+list.length+'…';r=await call({act:'saveItem',shop:CUR,...list[k]})}
   }
   if(r.ok){toast('Đã lưu '+list.length+' món ✓'+(r.failed&&r.failed.length?' · bỏ qua (danh sách đã đổi): '+r.failed.join(', '):''));await load()}
   else toast(r.msg||'Lỗi');
  }
 }finally{b.disabled=false;b.textContent=old}
}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.cname!==undefined){const p=t.closest('[data-ci]');if(p)cw()[+p.dataset.ci].n=t.value}});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='sel'){CUR=t.value;render()}
 if(t.id==='rm'){RM=t.value;render()}if(t.id==='rs'){RS=t.value;render()}if(t.id==='ro'){RO=t.checked;render()}
 if(t.dataset.paid){const r=await call({act:'setPaid',row:+t.dataset.row,code:t.dataset.code,paid:t.checked});toast(r.ok?'Đã cập nhật thanh toán':r.msg)}
 if(t.dataset.st){const r=await call({act:'setStatus',row:+t.dataset.row,code:t.dataset.code,status:t.value});toast(r.ok?'Đã cập nhật trạng thái':r.msg)}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,c=b.closest('[data-t]');
 if(d.saveall!==undefined){await saveAll(b);return}
 if(d.addnew!==undefined){b.closest('.c').insertAdjacentHTML('beforebegin',itemRow(BLANK));return}
 if(d.v){V=d.v;if(V==='rev'&&!REV){render();const r=await call({act:'report'});if(r.ok)REV=r.rows;else toast(r.msg||'Lỗi')}render();return}
 if(d.reload!==undefined){REV=null;await load();if(V==='rev'){const r=await call({act:'report'});if(r.ok)REV=r.rows;render()}toast('Đã tải lại');return}
 if(d.mv!==undefined){b.disabled=true;await moveShop(+d.mi,d.mv);return}
 if(d.menu!==undefined){CUR=D.shops[+d.menu].name;V='items';render();scrollTo(0,0);return}
 if(d.up){const i=c.querySelector('[data-f='+d.up+']');pick(async x=>{toast('Đang tải ảnh…');const r=await call({act:'upload',data:x});if(r.ok){i.value=r.url;toast('Đã tải ảnh. Nhớ bấm Lưu.')}else toast(r.msg)},d.up==='logo'?300:700);return}
 if(d.im){IM=d.im;try{localStorage.setItem('im',IM)}catch(e){}render();return}
 if(d.qs){const s=D.shops.find(x=>x.name===CUR),it=s&&s.items.find(x=>x.row==d.row),q=await call({act:'setState',shop:CUR,row:+d.row,name:d.name,state:d.qs});if(q.ok){if(it)it.state=d.qs;render();toast('Đã cập nhật ✓')}else toast(q.msg||'Lỗi');return}
 if(d.cup!==undefined||d.cdn!==undefined||d.cdel!==undefined||d.cadd!==undefined){const w=cw();
  if(d.cup!==undefined){const k=+d.cup;[w[k-1],w[k]]=[w[k],w[k-1]]}
  else if(d.cdn!==undefined){const k=+d.cdn;[w[k+1],w[k]]=[w[k],w[k+1]]}
  else if(d.cdel!==undefined)w.splice(+d.cdel,1);
  else{const v=$('ncat').value.trim();if(!v)return toast('Nhập tên nhóm');w.push({o:'',n:v})}
  render();return}
 if(d.csave!==undefined){const w=cw(),names=w.map(x=>x.n.trim());if(names.some(x=>!x))return toast('Có nhóm đang để trống tên');if(new Set(names).size<names.length)return toast('Tên nhóm bị trùng');const ren={};w.forEach(x=>{if(x.o&&x.o!==x.n.trim())ren[x.o]=x.n.trim()});
  const q=await call({act:'saveCats',shop:CUR,cats:names,renames:ren});if(q.ok){CW=null;toast('Đã lưu nhóm ✓');await load()}else toast(q.msg||'Lỗi');return}
 let r;
 if(d.addshop!==undefined){const n=$('nn').value.trim(),em=$('ne').value.trim();if(!n)return toast('Nhập tên quán');if(em&&!EMAIL_RE.test(em))return toast('Email quán chưa đúng định dạng (VD: quan@gmail.com)');r=await call({act:'saveShop',name:n,show:true,email:em})}
 else if(d.busy!==undefined){const s=D.shops[+d.busy];r=await call({act:'saveShop',name:s.name,...get(c),busy:!s.busy})}
 else if(d.saveshop!==undefined)r=await call({act:'saveShop',name:D.shops[+d.saveshop].name,...get(c),busy:D.shops[+d.saveshop].busy});
 else if(d.saveitem!==undefined)r=await call({act:'saveItem',shop:CUR,row:+c.dataset.row,...get(c)});
 else if(d.savecfg!==undefined)r=await call({act:'saveCfg',...get(c)});
 else if(d.del!==undefined){if(!confirm('Xóa món này?'))return;r=await call({act:'delItem',shop:CUR,row:+c.dataset.row})}
 else return;
 if(r.ok){toast('Đã lưu ✓');await load()}else toast(r.msg||'Lỗi')});
if(PASS)load();
function beep(){try{const x=new AudioContext(),o=x.createOscillator();o.connect(x.destination);o.frequency.value=880;o.start();o.stop(x.currentTime+.35)}catch(e){}}
setInterval(async()=>{if(!PASS||!D)return;const old=D.orders.length?D.orders[0].code:'',r=await call({act:'load'});if(!r.ok)return;D=r;const nw=r.orders.length?r.orders[0].code:'';if(nw&&nw!==old){beep();toast('🔔 Có đơn mới '+nw)}if(V==='orders'&&nw!==old)render()},30000);
</script></body></html>
